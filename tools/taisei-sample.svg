<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297" width="210mm" height="297mm" font-family="'Hiragino Sans', 'Yu Gothic', 'Meiryo', 'Noto Sans JP', sans-serif">
  <!-- 他店対抗POP サンプル台紙(ロゴ・マスコットなし)。単位 mm。tools/render_bg.mjs で PNG 化する -->
  <rect width="210" height="297" fill="#fff"/>
  <!-- 赤ヘッダー -->
  <rect x="8" y="8" width="194" height="128" fill="#d6231f"/>
  <!-- 右上コピー -->
  <text x="104" y="38" font-size="12" font-weight="900" fill="#fff" letter-spacing="0.5">どこよりも</text>
  <text x="104" y="54" font-size="11" font-weight="900" fill="#fff"><tspan>お買い</tspan><tspan fill="#ffd400" font-size="14">得</tspan><tspan>に挑戦!</tspan></text>
  <!-- メインコピー(黄文字・黒フチ) -->
  <g font-weight="900" fill="#ffd400" stroke="#1a1a1a" stroke-linejoin="round" paint-order="stroke fill">
    <text x="14" y="74" font-size="42" stroke-width="2.8">他店</text>
    <text x="14" y="127" font-size="38" stroke-width="2.4" letter-spacing="-1.5">徹底対抗!</text>
  </g>
  <!-- 白ボディ(赤枠) -->
  <rect x="8" y="136" width="194" height="153" fill="#fff" stroke="#d6231f" stroke-width="2.4"/>
  <!-- 商品名・型番の下線 -->
  <line x1="14" y1="157" x2="196" y2="157" stroke="#999" stroke-width="0.4" stroke-dasharray="1.5 1.5"/>
  <!-- 税別 -->
  <text x="13" y="172" font-size="11" font-weight="900" fill="#d6231f">税別</text>
  <!-- 税込 -->
  <g font-size="9" font-weight="900" fill="#1a1a1a">
    <text x="42" y="276">（税込</text>
    <text x="168" y="276">円）</text>
  </g>
</svg>
